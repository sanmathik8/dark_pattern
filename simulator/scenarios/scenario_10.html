<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scenario 10: Newsletter Popup</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; max-width: 650px; margin: 0 auto; shadow: 0 4px 12px rgba(0,0,0,0.3); }
        h1 { font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-top: 0; }
        .variant-badge { display: inline-block; font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 16px; }
        .dark-badge { background: #ef4444; color: white; }
        .clean-badge { background: #22c55e; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Scenario 10: Newsletter Popup</h1>
        <div id="content-container"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const variant = urlParams.get('variant') || 'dark';
        const container = document.getElementById('content-container');

        const darkHtml = `<div style="border:2px solid #ccc;padding:20px;">
                <h2>Get 20% Off Your First Purchase</h2>
                <button style="background:#22c55e;color:white;padding:10px 20px;">Claim My 20% Discount Now</button>
                <br><br>
                <button style="background:transparent;border:none;color:#888;font-size:11px;">No thanks, I prefer paying full price for items</button>
            </div>`;
        const cleanHtml = `<div style="border:2px solid #ccc;padding:20px;">
                <h2>Subscribe to Our Newsletter</h2>
                <button style="background:#3b82f6;color:white;padding:10px 20px;">Subscribe</button>
                <button style="background:#64748b;color:white;padding:10px 20px;margin-left:10px;">Close Window</button>
            </div>`;

        if (variant === 'clean') {
            container.innerHTML = '<span class="variant-badge clean-badge">CLEAN VARIANT</span>' + cleanHtml;
        } else {
            container.innerHTML = '<span class="variant-badge dark-badge">DARK VARIANT</span>' + darkHtml;
        }
    </script>
</body>
</html>
