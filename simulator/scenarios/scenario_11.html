<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scenario 11: Software Download Site</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; max-width: 650px; margin: 0 auto; shadow: 0 4px 12px rgba(0,0,0,0.3); }
        h1 { font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; margin-top: 0; }
        .variant-badge { display: inline-block; font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: bold; margin-bottom: 16px; }
        .dark-badge { background: #ef4444; color: white; }
        .clean-badge { background: #22c55e; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Scenario 11: Software Download Site</h1>
        <div id="content-container"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const variant = urlParams.get('variant') || 'dark';
        const container = document.getElementById('content-container');

        const darkHtml = `<div>
                <h2>Download Open-Source Utility v2.1</h2>
                <a href="#" style="background:#22c55e;color:white;padding:16px 32px;font-size:20px;display:inline-block;text-decoration:none;">DOWNLOAD NOW (ADVERTISED PARTNER APP)</a>
                <br><br>
                <a href="#" style="color:#aaa;font-size:9px;">Direct mirror download link</a>
            </div>`;
        const cleanHtml = `<div>
                <h2>Download Open-Source Utility v2.1</h2>
                <a href="#" style="background:#3b82f6;color:white;padding:12px 24px;display:inline-block;text-decoration:none;">Download File (v2.1 .zip)</a>
            </div>`;

        if (variant === 'clean') {
            container.innerHTML = '<span class="variant-badge clean-badge">CLEAN VARIANT</span>' + cleanHtml;
        } else {
            container.innerHTML = '<span class="variant-badge dark-badge">DARK VARIANT</span>' + darkHtml;
        }
    </script>
</body>
</html>
